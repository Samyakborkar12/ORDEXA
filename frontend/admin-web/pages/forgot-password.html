<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Admin Portal - ORDEXA</title>
    <link rel="stylesheet" href="../css/forgot-password.css">
    <link rel="icon" type="image/svg+xml" href="../assets/logo/ordexa-favicon.svg">
</head>
<body>

<div class="auth-card">
    <div class="logo">
        <img src="../assets/logo/ordexa-logo.svg" alt="ORDEXA" class="sidebar-logo-img">
        ORD<span>EXA</span>
    </div>
    <div class="title">Reset Admin Password</div>
    <div class="subtitle">Enter your registered administrator email to set a new password.</div>

    <div class="message-box" id="msgBox"></div>

    <form id="resetForm" onsubmit="handleReset(event)">
        <div class="form-group">
            <label>Registered Admin Email</label>
            <input type="email" class="form-control" id="email" required placeholder="admin@ordexa.com">
        </div>

        <div class="form-group">
            <label>New Password (min 6 characters)</label>
            <input type="password" class="form-control" id="newPassword" required placeholder="••••••••" minlength="6">
        </div>

        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" class="form-control" id="confirmPassword" required placeholder="••••••••" minlength="6">
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Update Password →</button>
    </form>

    <div class="auth-footer">
        Remember your password? <a href="login.html">Back to Admin Login</a>
    </div>
</div>

<script src="../js/forgot-password.js" defer></script>
</body>
</html>
