<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - ORDEXA Admin</title>


    <link rel="stylesheet" href="../css/login.css">

    <link rel="icon" type="image/svg+xml" href="../assets/logo/ordexa-favicon.svg">
</head>


<body>


<!-- ================================
     LOGIN CARD
================================= -->

<div class="login-card">


    <!-- LOGO -->

    <div class="logo-container">
        <img src="../assets/logo/ordexa-logo.svg" alt="ORDEXA Logo" class="brand-logo-img">
        <span class="logo-text">ORDEXA ADMIN</span>
    </div>



    <!-- HEADER -->

    <div class="login-header">

        <h2>

            Welcome back

        </h2>


        <p>

            Sign in to manage your
            organization and queues.

        </p>

    </div>



    <!-- ERROR -->

    <div
        class="error-message"
        id="errorMessage">

    </div>



    <!-- SUCCESS -->

    <div
        class="success-message"
        id="successMessage">

        Login successful! Redirecting...

    </div>



    <!-- LOGIN FORM -->

    <form id="loginForm">


        <!-- EMAIL -->

        <div class="form-group">


            <label for="email">

                Email Address

            </label>


            <input
                type="email"
                id="email"
                class="form-control"
                placeholder="Enter your email"
                required>


        </div>



        <!-- PASSWORD -->

        <div class="form-group">


            <label for="password">

                Password

            </label>


            <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Enter your password"
                required>


            <button
                type="button"
                class="password-toggle"
                id="togglePassword">

                Show

            </button>


        </div>



        <!-- OPTIONS -->

        <div class="form-options">


            <label class="remember-me">


                <input
                    type="checkbox"
                    id="rememberMe">


                Remember me


            </label>



            <a
                href="forgot-password.html"
                class="forgot-link">

                Forgot password?

            </a>


        </div>



        <!-- SUBMIT -->

        <button
            type="submit"
            class="btn-submit"
            id="submitBtn">

            Sign In

        </button>


    </form>



    <!-- REGISTER -->

    <div class="register-link">


        <span>

            New Admin?

        </span>


        <a href="register.html">

            Register Admin

        </a>


    </div>


</div>



<script src="../js/login.js" defer></script>


</body>

</html>
