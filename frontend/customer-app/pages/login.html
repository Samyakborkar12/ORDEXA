<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDEXA - Login</title>

    <link rel="stylesheet" href="../css/auth.css">
    <link rel="icon" type="image/svg+xml" href="../assets/logo/ordexa-favicon.svg">
</head>

<body>

<div class="container">

    <div class="logo">
        <img src="../assets/logo/ordexa-logo.svg" alt="ORDEXA Logo" class="auth-logo-img">
        <h1>ORDEXA</h1>
        <p>Smart Queue Management</p>
    </div>

    <div class="card">

        <h2>Welcome Back</h2>
        <p class="subtitle">Login to continue to your ORDEXA account.</p>

        <form id="loginForm">

            <div class="field">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="field">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <div class="options">

                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember Me
                </label>

                <span class="forgot" onclick="forgotPassword()">
                    Forgot Password?
                </span>

            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                Login
            </button>

            <div id="message" class="message"></div>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </div>

        <div class="back">
            <a href="welcome.html">← Back to Welcome</a>
        </div>

    </div>

</div>

<script src="../js/auth.js" defer></script>

</body>
</html>
