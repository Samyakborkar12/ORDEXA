<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ORDEXA - Register</title>

    <link rel="stylesheet" href="../css/register.css">

    <link rel="icon" type="image/svg+xml" href="../assets/logo/ordexa-favicon.svg">
</head>

<body>

<div class="container">

    <div class="logo">
            <img src="../assets/logo/ordexa-logo.svg" alt="ORDEXA" class="welcome-logo-img">
            <span>ORDEXA</span>
        </div>

    <div class="card">

        <h1>
            Create your account
        </h1>

        <p class="subtitle">
            Create an ORDEXA account to join and
            track queues digitally.
        </p>


        <div
            id="message"
            class="message">
        </div>


        <form id="registerForm">

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number">

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter password"
                    minlength="6"
                    required>

            </div>


            <button
                type="submit"
                class="btn"
                id="registerButton">

                Create Account

            </button>

        </form>


        <div class="bottom">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>


    <a
        href="welcome.html"
        class="back">

        ← Back to Welcome

    </a>

</div>


<script src="../js/register.js" defer></script>

</body>
</html>
