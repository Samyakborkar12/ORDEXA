<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejoin Queue - ORDEXA</title>
    <link rel="stylesheet" href="../css/rejoin-queue.css">
    <link rel="icon" type="image/svg+xml" href="../assets/logo/ordexa-favicon.svg">
</head>
<body>

<header class="header">
    <a href="home.html" class="logo"><img src="../assets/logo/ordexa-logo.svg" alt="ORDEXA" class="app-logo-img"> <span>ORDEXA</span></a>
    <div class="header-title">Rejoin Queue</div>
    <div style="width: 40px;"></div>
</header>

<main class="main">
    <div class="rejoin-card">
        <div class="status-badge">⏳ TOKEN ON HOLD</div>

        <div class="token-display" id="tokenCodeText">ORD-001</div>
        <p style="color: #8faabd; font-size: 13px; margin-bottom: 20px;">Your spot is currently paused</p>

        <div class="rejoin-desc">
            Are you back in the waiting area? Tap below to unpause your token. You will be scheduled to be called by the next available counter desk.
        </div>

        <button class="btn-rejoin" onclick="handleRejoin()" id="rejoinBtn">⚡ Rejoin Waiting Queue</button>
    </div>
</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
    <div class="nav-inner">
        <div class="nav-item" onclick="location.href='home.html'"><div class="nav-icon">⌂</div>Home</div>
        <div class="nav-item" onclick="location.href='explore.html'"><div class="nav-icon">🔎</div>Explore</div>
        <div class="nav-item active" onclick="location.href='view-queue.html'"><div class="nav-icon">🎟</div>My Queue</div>
        <div class="nav-item" onclick="location.href='notifications.html'"><div class="nav-icon">🔔</div>Alerts</div>
        <div class="nav-item" onclick="location.href='profile.html'"><div class="nav-icon">👤</div>Profile</div>
    </div>
</nav>

<script src="../js/rejoin-queue.js" defer></script>
</body>
</html>
